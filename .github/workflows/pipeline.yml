name: Primeira pipeline

on:
  push:
    branches: [main]

jobs:
  testesoma:
    runs-on: ubuntu-latest
  
    steps:  
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install pytest

      - name: Executar testes
        run: pytest teste_soma.py

  testesub:
  
    runs-on: ubuntu-latest
  
    steps:  
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install pytest

      - name: Executar testes
        run: pytest test_sub.py
  
  testemult:
    runs-on: ubuntu-latest
  
    steps:  
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install pytest

      - name: Executar testes
        run: pytest test_mult.py
  
  testediv:
    runs-on: ubuntu-latest
  
    steps:  
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install pytest

      - name: Executar testes
        run: pytest teste_div.py

      

  deploy:
    needs: [testesoma, testesub, testemult, testediv]
    runs-on: ubuntu-latest
    steps:
        - run: echo "Deploy realizado com sucesso!"

      




    