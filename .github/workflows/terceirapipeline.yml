name: Terceira pipeline Python

on:
  push:
    branches: [main]

jobs:

  Build:
    name: Buildar e enviar imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}



      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: samukasantos12/cicdpipeline:latest

  Teste:
    name: Testar aplicação no container
    needs: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Rodar testes dentro do Container
        run: docker run --rm samukasantos12/cicdpipeline:latest python -m pytest testPY/test_soma.py

      - name: Subir Ambiente de Teste 
        run: docker compose up -d --pull always

      - name: Validar Comunicação (Ping) 
        run: docker compose exec -T servico-vizinho ping -c 1 cicdpipeline

  Deploy:
    needs: Teste
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy
        run: echo "Deploy realizado com sucesso!"