name: Terceira pipeline Python

on:
  push:
    branches: [main]

jobs:

  Qualidade:
    name: SonarQube
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  Build:
    name: Buildar e enviar imagem Docker
    runs-on: ubuntu-latest
    needs: Qualidade

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: samukasantos12/cicdpipeline:latest


  Teste:
    name: Testar aplicação no container
    needs: Build
    runs-on: ubuntu-latest

    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Rodar testes dentro do Container
        run: docker run --rm samukasantos12/cicdpipeline:latest python -m pytest testPY/test_soma.py


  Deploy:
    needs: Teste
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy
        run: echo "Deploy realizado com sucesso!"