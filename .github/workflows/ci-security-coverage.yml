                                                                                                                     name: Pipeline CI - Cobertura e Segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-coverage-security:
    name: Cobertura e Segurança (Python)
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de teste e segurança
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov bandit

      - name: Análise de Segurança SAST (Bandit)
        run: |
          python -m bandit -r testPY/ -s B101

      - name: Executar Testes com Cobertura de Código (pytest-cov)
        run: |
          python -m pytest --cov=testPY --cov-report=term-missing --cov-report=xml:coverage-python.xml --cov-report=html:coverage-python-html

      - name: Upload Relatório de Cobertura Python (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura-python
          path: |
            coverage-python.xml
            coverage-python-html/

  java-coverage-security:
    name: Cobertura e Segurança (Java)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Baixar JaCoCo Agent e CLI
        run: |
          curl -sL https://repo1.maven.org/maven2/org/jacoco/org.jacoco.cli/0.8.11/org.jacoco.cli-0.8.11-nodeps.jar -o jacococli.jar
          curl -sL https://repo1.maven.org/maven2/org/jacoco/org.jacoco.agent/0.8.11/org.jacoco.agent-0.8.11-runtime.jar -o jacocoagent.jar

      - name: Compilar código Java
        run: |
          javac -d out testJava/Calculadora.java testJava/TesteSoma.java testJava/TesteSub.java testJava/TesteMult.java testJava/TesteDiv.java

      - name: Executar Testes Java com Agente JaCoCo
        run: |
          java -javaagent:jacocoagent.jar=destfile=jacoco.exec -cp out TesteSoma
          java -javaagent:jacocoagent.jar=destfile=jacoco.exec,append=true -cp out TesteSub
          java -javaagent:jacocoagent.jar=destfile=jacoco.exec,append=true -cp out TesteMult
          java -javaagent:jacocoagent.jar=destfile=jacoco.exec,append=true -cp out TesteDiv

      - name: Gerar Relatório de Cobertura JaCoCo
        run: |
          java -jar jacococli.jar report jacoco.exec --classfiles out --sourcefiles testJava --html coverage-java-html --xml coverage-java.xml

      - name: Upload Relatório de Cobertura Java (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura-java
          path: |
            coverage-java.xml
            coverage-java-html/

  security-sast-scan:
    name: Varredura de Segurança do Repositório (Trivy SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Análise de Segurança Trivy (FS & Secrets Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
